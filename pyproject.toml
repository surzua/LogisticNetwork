[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logistic-network"
version = "0.1.0"
description = "Predicción de demanda y optimización de redes logísticas"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pulp",
    "streamlit",
    "matplotlib",
    "seaborn",
    "plotly",
    "polars>=1.36.1",
    "lightgbm>=4.6.0",
    "ortools>=9.15.6755",
    "pydeck>=0.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "ipykernel",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "ipykernel>=6.31.0",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
]
