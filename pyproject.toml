[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logistic-network"
version = "0.1.0"
description = "Predicción de demanda y optimización de redes logísticas"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pulp",
    "streamlit",
    "matplotlib",
    "seaborn",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "ipykernel",
]
